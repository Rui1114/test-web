name: 每周数据更新（周一08:30北京时间）

on:
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests openai

      - name: 运行每日更新脚本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/daily_update.py

      - name: 确保 metadata 时间戳更新
        run: |
          python3 - <<'PYEOF'
          import json, datetime
          from pathlib import Path
          for p in [Path('public/data/metadata.json'), Path('data/metadata.json')]:
              if p.exists():
                  m = json.loads(p.read_text())
                  m['lastUpdated'] = datetime.date.today().isoformat()
                  m['lastUpdateTime'] = datetime.datetime.utcnow().isoformat()
                  p.write_text(json.dumps(m, ensure_ascii=False, indent=2))
                  print(f'Updated {p}')
          PYEOF

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ data/
          git diff --cached --quiet && echo "No changes" || git commit -m "每周数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
          git push

      - name: 同步到腾讯云COS（可选）
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
        run: |
          if [ -z "$COS_SECRET_ID" ]; then
            echo "未配置COS密钥，跳过COS同步"
            exit 0
          fi
          pip install coscmd
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r ap-hongkong
          coscmd upload -rs --delete public/ / || echo "COS同步失败，已跳过（不影响GitHub更新）"

      - name: 部署到香港VPS服务器（可选）
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.VPS_HOST != '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/html
            git fetch origin main
            git reset --hard origin/main
            echo "VPS已同步 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
