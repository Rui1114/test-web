name: 每日数据更新

on:
  schedule:
    # 00:30 UTC = 08:30 北京时间，每天自动运行
    - cron: '30 0 * * *'
  workflow_dispatch:
    # 支持在 GitHub 网页上手动点击触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests openai

      - name: 运行每日更新脚本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/daily_update.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "每日数据更新 $(date '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: 安装腾讯云 CLI 工具
        run: pip install coscmd

      - name: 同步到腾讯云COS（香港）
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
        run: |
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
            -b "$COS_BUCKET" -r ap-hongkong
          coscmd upload -rs --delete public/ /
          echo "✅ 腾讯云COS同步完成"
