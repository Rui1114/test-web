name: 每日数据更新

on:
  schedule:
    # 00:30 UTC = 08:30 北京时间，每天自动运行
    - cron: '30 0 * * *'
  workflow_dispatch:
    # 支持在 GitHub 网页上手动点击触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests openai

      - name: 运行每日更新脚本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/daily_update.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          # 只有数据有变化时才提交（触发 Vercel 重新部署）
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "每日数据更新 $(date '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
